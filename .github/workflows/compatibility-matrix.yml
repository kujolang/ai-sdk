name: compatibility-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime_version:
          - "v1.5.0"
          - "v1.6.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install checksum-verified published Kujo runtime
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: ${{ matrix.runtime_version }}

      - name: Export runtime path
        run: echo "KUJO_BIN=${{ steps.runtime.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Verify Kujo runtime
        run: ./kujo --version

      - name: Run contract suite
        run: ./kujo test-run tests/sdk_contract_tests.kujo

      - name: Run reliability suite
        run: ./kujo test-run tests/reliability_failure_modes_tests.kujo

      - name: Run feature smoke suite
        run: ./kujo test-run tests/feature_smoke_tests.kujo
