name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sdk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install checksum-verified published Kujo runtime
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0

      - name: Export runtime path
        run: echo "KUJO_BIN=${{ steps.runtime.outputs.kujo-path }}" >> "$GITHUB_ENV"

      - name: Verify Kujo runtime
        run: ./kujo --version

      - name: Verify docs and command freshness
        shell: bash
        run: bash scripts/verify_docs.sh

      - name: Reject root scratch Kujo files
        shell: bash
        run: |
          set -euo pipefail
          scratch_files="$(find . -maxdepth 1 -type f -name 'test_*.kujo' -print)"
          if [ -n "$scratch_files" ]; then
            echo "Found disallowed root scratch Kujo files:"
            echo "$scratch_files"
            exit 1
          fi

      - name: Run supply-chain policy checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/supply_chain_policy_check.sh

      - name: Run release quality gates
        shell: bash
        run: |
          set -euo pipefail
          # Keep push/PR verification aligned with release gates to avoid drift.
          bash scripts/release_quality_gates.sh
